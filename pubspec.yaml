name: akuji
description: "AKUJI: Peachez's private, persistent, avatar-first on-device AI."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^11.0.3
  flutter_gemma: ^1.5.9
  flutter_gemma_litertlm: ^1.4.2
  flutter_gemma_mediapipe: ^1.0.4
  flutter_tts: ^4.2.5
  path: ^1.9.1
  path_provider: ^2.1.5
  speech_to_text: ^7.4.0
  sqflite: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/akuji_core.md
    - assets/akuji_full_body.b64
