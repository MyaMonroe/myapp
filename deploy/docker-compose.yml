services:
  bridge:
    build:
      context: ../bridge
    container_name: akuji-bridge
    restart: unless-stopped
    environment:
      AKUJI_BRIDGE_TOKEN: "${AKUJI_BRIDGE_TOKEN}"
      PICSART_API_KEY: "${PICSART_API_KEY:-}"
      AKUJI_BRIDGE_ALLOW_EXECUTION: "${AKUJI_BRIDGE_ALLOW_EXECUTION:-false}"
    ports:
      - "127.0.0.1:8787:8787"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: akuji-tunnel
    restart: unless-stopped
    depends_on:
      - bridge
    command: tunnel --no-autoupdate --url http://bridge:8787
