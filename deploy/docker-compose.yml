services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: akuji-hermes
    restart: unless-stopped
    command: gateway run
    volumes:
      - hermes_data:/opt/data
      - ./hermes-config.yaml:/opt/data/config.yaml:ro
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: "${HERMES_API_SERVER_KEY}"
      PICSART_API_KEY: "${PICSART_API_KEY}"
    expose:
      - "8642"

  bridge:
    build:
      context: ../bridge
    container_name: akuji-bridge
    restart: unless-stopped
    depends_on:
      - hermes
    environment:
      AKUJI_BRIDGE_TOKEN: "${AKUJI_BRIDGE_TOKEN}"
      AKUJI_HARNESS_KIND: "hermes"
      AKUJI_HARNESS_BASE_URL: "http://hermes:8642"
      AKUJI_HARNESS_TOKEN: "${HERMES_API_SERVER_KEY}"
      AKUJI_BRIDGE_ALLOW_EXECUTION: "${AKUJI_BRIDGE_ALLOW_EXECUTION:-false}"
    ports:
      - "127.0.0.1:8787:8787"

volumes:
  hermes_data:
