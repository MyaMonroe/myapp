name: Generate AKUJI LAM Avatar

on:
  pull_request:
    branches:
      - main
    paths:
      - "lam/**"
      - ".github/workflows/akuji-lam-avatar.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Check out private AKUJI build
        uses: actions/checkout@v4
        with:
          ref: akuji-lam-avatar

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install client
        run: pip install --disable-pip-version-check gradio_client requests

      - name: Generate LAM avatar package
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -u lam/run_lam.py 2>&1 | tee artifacts/lam-run.log

      - name: Return verified package to private branch
        if: success()
        shell: bash
        run: |
          mkdir -p generated-avatar
          cp artifacts/AKUJI-h5-render-data.zip generated-avatar/
          cp artifacts/AKUJI-h5-contents.txt generated-avatar/
          cp artifacts/result.json generated-avatar/
          git config user.name "AKUJI Build"
          git config user.email "actions@users.noreply.github.com"
          git add generated-avatar
          git commit -m "Store verified AKUJI LAM avatar package [skip ci]"
          git push origin HEAD:akuji-lam-avatar

      - name: Upload AKUJI avatar artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AKUJI-LAM-avatar
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
