name: Build permanently signed AKUJI APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore AKUJI signing identity
        env:
          AKUJI_SIGNING_BUNDLE: ${{ secrets.AKUJI_SIGNING_BUNDLE }}
        run: |
          test -n "$AKUJI_SIGNING_BUNDLE" || {
            echo "AKUJI_SIGNING_BUNDLE has not been saved in this repository."
            exit 1
          }
          mkdir -p .signing
          printf '%s' "$AKUJI_SIGNING_BUNDLE" | base64 --decode > .signing/bundle.zip
          unzip -q .signing/bundle.zip -d .signing
          test -s .signing/akuji-release.p12
          test -s .signing/signing.properties

      - name: Build permanent release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Upload permanent APK
        uses: actions/upload-artifact@v4
        with:
          name: AKUJI-permanent-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Remove signing files
        if: always()
        run: |
          rm -f .signing/akuji-release.p12
          rm -f .signing/signing.properties
          rm -f .signing/bundle.zip
